[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-sorter"
version = "0.1.0"
description = "Organize messy directories into tidy category folders."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
smart-sort = "smart_file_sorter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["smart_file_sorter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
